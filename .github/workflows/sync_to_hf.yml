name: Sync to HF

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Hugging Face deploy
        run: |
          set -euo pipefail

          # --- HF Spaces Streamlit config ---
          printf '%s\n' \
            '---' \
            'title: SERS Data Explorer' \
            'sdk: streamlit' \
            'app_file: apps/app.py' \
            '---' \
            '' > /tmp/frontmatter
          cat /tmp/frontmatter README.md > README.md.tmp
          mv README.md.tmp README.md

          # --- Python dependencies for the Space ---
          python3 -c "
          import tomllib
          data = tomllib.load(open('pyproject.toml', 'rb'))
          deps = data.get('project', {}).get('dependencies', [])
          open('requirements.txt', 'w').write('\n'.join(deps))
          "

          # --- Remove tracked Excel files (HF rejects binary .xlsx/.xls) ---
          if git ls-files -z '*.xlsx' '*.xls' '*.XLSX' '*.XLS' | grep -q .; then
            git ls-files -z '*.xlsx' '*.xls' '*.XLSX' '*.XLS' \
              | xargs -0 git rm -f
          else
            echo "No tracked Excel files found."
          fi

          # --- Single orphan commit: no GitHub history, no leftover binary blobs ---
          git checkout --orphan hf-deploy
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: HF Spaces deploy"

          # Sanity check before push
          if git ls-files '*.xlsx' '*.xls' '*.XLSX' '*.XLS' | grep -q .; then
            echo "ERROR: Excel files still present in deploy commit."
            git ls-files '*.xlsx' '*.xls' '*.XLSX' '*.XLS'
            exit 1
          fi
          echo "Deploy commit ready ($(git rev-list --count HEAD) commit, no Excel files)."

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push -f \
            "https://LJXXXD:${HF_TOKEN}@huggingface.co/spaces/LJXXXD/sensd-sers-analysis" \
            HEAD:main
